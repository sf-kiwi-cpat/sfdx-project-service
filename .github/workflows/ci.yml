name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Group by ref so each PR (and `main`) gets its own concurrency lane;
# cancel-in-progress only fires on `pull_request` events so superseded
# PR pushes are cancelled while pushes to `main` always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run build

  unit:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      # The default reporter keeps the human-readable output we want in
      # the workflow log; the json reporter writes test-results.json,
      # which scripts/test-timing-report.js consumes in the next step.
      # See GitHub #248 (part 1: report only, no budget gate yet).
      - run: npm run test:unit -- --reporter=default --reporter=json --outputFile=test-results.json

      # `if: always()` so timing data still surfaces when tests fail —
      # a slow-and-failing test should be visible on both axes.
      - name: Top 20 slowest tests
        if: always()
        run: node scripts/test-timing-report.js --input=test-results.json --tier=unit

  integration:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run test:integration -- --reporter=default --reporter=json --outputFile=test-results.json

      - name: Top 20 slowest tests
        if: always()
        run: node scripts/test-timing-report.js --input=test-results.json --tier=integration

  spec:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run test:spec -- --reporter=default --reporter=json --outputFile=test-results.json

      - name: Top 20 slowest tests
        if: always()
        run: node scripts/test-timing-report.js --input=test-results.json --tier=spec

  knip:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run lint:deps
