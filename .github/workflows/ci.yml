name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Group by ref so each PR (and `main`) gets its own concurrency lane;
# cancel-in-progress only fires on `pull_request` events so superseded
# PR pushes are cancelled while pushes to `main` always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run build

  unit:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run test:integration

  spec:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run test:spec

  # Hard gate on the coverage thresholds defined in vitest.config.ts.
  # Runs the full suite (not a per-stage slice) because v8 coverage on a
  # partial slice would fail spuriously — e.g. anything only exercised
  # by integration tests would look uncovered to the unit slice. The
  # parallel test jobs above keep the per-stage signal fast; this job
  # exists solely to enforce the threshold on the merged execution. See
  # issue #240 for the design rationale and the option-A vs option-B
  # tradeoff.
  coverage:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run test:coverage

  knip:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Rewrite Nexus URLs in all lockfiles
        run: find . -not -path '*/node_modules/*' -name package-lock.json -exec sed -i 's|https://nexus-proxy.repo.local.sfdc.net/nexus/content/groups/npm-all/|https://registry.npmjs.org/|g' {} +

      - run: npm ci

      - run: npm run lint:deps
